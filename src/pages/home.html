
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trang Chủ - EduTask</title>

    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/home.css">
</head>

<body>

    <!-- Header được tạo bằng JavaScript -->
    <div id="header-container"></div>

    <main class="main-content">

        <section class="dashboard-preview">

            <h2>Danh sách bài tập của bạn</h2>

            <div class="task-grid">

                <div class="task-card">
                    <h3>Lập trình Web</h3>
                    <p>Hoàn thành bài tập lớn PHP & MySQL</p>
                    <span class="badge warning">Đang làm</span>
                </div>

                <div class="task-card">
                    <h3>Mạng máy tính</h3>
                    <p>Cấu hình VLAN trên Cisco Packet Tracer</p>
                    <span class="badge danger">Chưa làm</span>
                </div>

            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Quản Lý Bài Tập Sinh Viên.</p>
    </footer>

    <!-- JavaScript trang chủ -->
    <script type="module" src="../js/home.js"></script>

</body>
</html>
